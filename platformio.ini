; PlatformIO 构建配置。命令（在本仓库根目录）：
;   pio run -e car              编译
;   pio run -e car -t upload    烧录（数据线插板子标 COM 的口，CH343 那个）
;   pio device monitor          串口监视器 115200
;
; 板子是 YD-ESP32-S3 N8R2（8MB Flash + 2MB 四线 PSRAM，实测）：
;  - memory_type 用 qio_qspi（四线 PSRAM）。qio_opi 是八线 PSRAM（R8 系）的配置，
;    在这块板上开机报 "octal_psram: PSRAM chip is not connected"，初始化失败。
;  - 四线 PSRAM 编译在内但开机不自动初始化；当前固件只用内部 RAM，不受影响。
;    以后要用 PSRAM 的话，参考 examples/main_minimal.cpp 里的手动初始化写法
;    （esp_psram_init() + esp_psram_extram_add_to_heap_allocator()，实测 2MB 可用）。
;
; platform 用 pioarduino 的 espressif32 平台 zip（官方 PlatformIO 的 espressif32
; 还不支持 arduino-esp32 3.x），锁定 55.03.312-1：带 arduino-esp32 3.3.12 +
; xtensa-esp-elf 14.2.0。board 用 esp32-s3-devkitc-1 定义（8MB Flash 通用 S3），
; PSRAM 类型由上面的 memory_type 指定。

[platformio]
src_dir = firmware/car

[env:car]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
monitor_speed = 115200
; Serial 走 UART0（COM 口的 CH343）；CORE_DEBUG_LEVEL=4 打开框架调试日志，
; bring-up 期间有用，调完硬件可降到 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=4
lib_deps =
    pololu/VL53L0X @ ^1.1.1
